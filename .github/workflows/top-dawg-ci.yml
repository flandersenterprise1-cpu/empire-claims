name: Top Dawg FE Smart Quote CI

on:
  push:
    branches: ["**"]
    paths:
      - 'top-dawg-fe-smart-quote/**'
      - '.github/workflows/top-dawg-ci.yml'
  pull_request:
    paths:
      - 'top-dawg-fe-smart-quote/**'
      - '.github/workflows/top-dawg-ci.yml'

defaults:
  run:
    working-directory: top-dawg-fe-smart-quote

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topdawg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/topdawg_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/topdawg_test
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-1234567890
      SEED_DEMO_CARRIER: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: top-dawg-fe-smart-quote/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + integration)
        run: npm test

      - name: Build
        run: npm run build
